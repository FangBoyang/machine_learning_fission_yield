# 变体 p_ft：基于 p_gef_isomer_delta_np(GEF 异构合并 warmup) 的【235UALL finetune】
# 继承 j_power_delta_np（width=20-20, grid=20, k=4, 目标幂次 p=0.25, delta_np 修正后），
# 但 model 段显式覆盖为 p 的架构 [16,16]/grid=15/k=3，保持与 init_from 的 p 一致。
#
# 关键（与 o_ft 对应，仅把预训练基从 n 换成 p）：
# - 预训练基：p_gef_isomer_delta_np（init_from / reuse_scalers_from 同一变体）。
#   02_train 加载 p 的 checkpoint 时会用 p 的真实架构 [16,16]/grid15/k3 重建模型，
#   此处 model 段仅作文档/自洽用途。
# - 冻结策略：full finetune（freeze: []）。
# - val 比例：0.2（仅来自前 3096 行；重要区 [3096,4127) 100% 进训练）。
# - 早停：monitor=val_loss（用实验分布做判据）。
# - lr=0.001（比 warmup 的 0.05 低）；checkpoint_every=50 便于安全中断后续训。
# - reuse_scalers_from=p：复用 p 的 scalers（含 GEF_isomer_merged 上拟合的 Yield_power），
#   保证特征/目标空间与 warmup 逐字节一致（续训成立的命门）。
inherit: j_power_delta_np.yaml
experiment:
  name: p_ft_235UALL_power_delta_np
  description: "基于p_gef_isomer_delta_np(GEF异构合并warmup,[16,16]/grid15/k3)的235UALL finetune：复用scalers+权重，val仅来自前3096行，val_loss早停"
data:
  source: csv
  csv_path: data/235UALL.csv
  header: true
  columns: [Z, A, E, Yield, Error]
  split:
    mode: held_out
    val_from_first_n: 3096
    val_ratio: 0.2
    seed: 42
model:
  hidden_layers: [16, 16]
  grid: 15
  k: 3
target:
  power: 0.25            # 与 p warmup 一致（对 t=y^0.25 做 MSE）
finetune:
  init_from: p_gef_isomer_delta_np
  reuse_scalers_from: p_gef_isomer_delta_np
  freeze: []             # full finetune；冻结前层例: ['act_fun.0']
eval:
  eval_set: val
  important_range: [3096, 4127]
train:
  optimizer:
    lr: 0.001
  early_stopping:
    monitor: val_loss
    patience: 300
  checkpoint_every: 50
