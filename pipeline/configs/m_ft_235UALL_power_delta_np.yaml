# 变体 m(j-power)：基于 j_power_delta_np 的 235UALL finetune
# 继承 j_power（width=20-20, grid=20, k=4, 目标幂次 p=0.25, delta_np）。
#
# 自选旋钮（按推荐）：
# - 预训练基：j_power_delta_np（init_from / reuse_scalers_from 同一变体）
# - 冻结策略：full finetune（freeze: []）；要冻结前层可改为 ['act_fun.0']
# - val 比例：0.2（来自前 3096 行；重要区 100% 进训练）
# - 早停：monitor=val_loss（实验分布做判据）
# - lr=0.001（比预训练 0.05 低）；checkpoint_every=50 便于安全中断后续训
inherit: j_power_delta_np.yaml
experiment:
  name: m_ft_235UALL_power_delta_np
  description: "基于j_power(p=0.25,width20-20,grid20)的235UALL finetune：复用scalers+权重，val仅来自前3096行，val_loss早停"
data:
  source: csv
  csv_path: data/235UALL.csv
  header: true
  columns: [Z, A, E, Yield, Error]
  split:
    mode: held_out
    val_from_first_n: 3096
    val_ratio: 0.2
    seed: 42
finetune:
  init_from: j_power_delta_np
  reuse_scalers_from: j_power_delta_np
  freeze: []          # full finetune；冻结前层例: ['act_fun.0']
eval:
  eval_set: val
  important_range: [3096, 4127]
train:
  optimizer:
    lr: 0.001
  early_stopping:
    monitor: val_loss
    patience: 300
  checkpoint_every: 50
