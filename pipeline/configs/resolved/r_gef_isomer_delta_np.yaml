# 源文件 : configs/r_gef_isomer_delta_np.yaml
# 继承链 : base -> g_rawY_delta_np -> j_power_delta_np -> n_power_delta_np -> r_gef_isomer_delta_np
# 说明   : 以下为 common.load_config 展开后的全部生效参数
#          （inherit 已合并、已移除；可直接作为独立配置喂回 load_config）
# ============================================================================
experiment:
  name: r_gef_isomer_delta_np
  description: 单隐藏层[4,58,1] GEF异构合并warmup，固定G=15(k=3,p=0.25,full_train,monitor=train_loss)
data:
  csv_path: data/GEF_isomer_merged.csv
  header: true
  columns:
  - Z_norm
  - A_norm
  - E_norm
  - Yield
  - Error
  target_col: 3
  features:
  - Z_norm
  - A_norm
  - E_norm
  - delta_np
  use_delta_np: true
  delta_np_mode: discrete
  split: full_train
  source: csv
target:
  space: raw
  clip_min: 0.0
  scaler_type: standard
  power: 0.25
model:
  hidden_layers:
  - 58
  grid: 15
  k: 3
  seed: 42
train:
  epochs: 1500
  batch_size: 512
  optimizer:
    type: AdamW
    lr: 0.01
    weight_decay: 1e-4
  scheduler:
    type: CosineHoldAtMin
    T_0: 400
    T_mult: 1
    eta_min: 1e-5
    step_size: 500
    gamma: 0.5
    patience: 300
    factor: 0.5
    T_max: 400
  early_stopping:
    patience: 400
    min_delta: 5e-6
    monitor: train_loss
  criterion:
    type: MSE
    low_yield_mode: none
    high_yield_boost: 1.0
    low_yield_quantile: 0.3
    huber_delta: 0.1
  gradient_clip: 1.0
  resume: false
  checkpoint_every: 50
  stop_on_best_below: null
  lbfgs:
    enabled: false
postprocess:
  mass_conservation: false
energy_dep:
  enabled: true
  reference_csv: data/235UALL.csv
  E_range:
  - 0
  - 14
  E_step: 1
  batch_size: 256
