experiment:
  name: i_rawY_delta_np_smaller
  description: 当前主力变体，紧凑结构，原始空间
data:
  csv_path: data/GEF.csv
  header: false
  columns:
  - Z_norm
  - A_norm
  - E_norm
  - Yield
  - Error
  target_col: 3
  features:
  - Z_norm
  - A_norm
  - E_norm
  - delta_np
  use_delta_np: true
  delta_np_mode: discrete
  split: full_train
target:
  space: raw
  clip_min: 0.0
  scaler_type: standard
model:
  hidden_layers:
  - 12
  - 12
  grid: 5
  k: 3
  seed: 42
train:
  epochs: 2000
  batch_size: 256
  optimizer:
    type: AdamW
    lr: 0.01
    weight_decay: 1e-4
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 300
    T_mult: 1
    eta_min: 1e-5
    step_size: 500
    gamma: 0.5
    patience: 300
    factor: 0.5
  early_stopping:
    patience: 300
    min_delta: 5e-6
    monitor: train_loss
  criterion:
    type: MSE
    low_yield_mode: none
    high_yield_boost: 1.0
    low_yield_quantile: 0.3
    huber_delta: 0.1
  gradient_clip: 1.0
  resume: false
  checkpoint_every: 0
  stop_on_best_below: null
postprocess:
  mass_conservation: false
energy_dep:
  enabled: true
  reference_csv: data/235UALL.csv
  E_range:
  - 0
  - 14
  E_step: 1
  batch_size: 256
