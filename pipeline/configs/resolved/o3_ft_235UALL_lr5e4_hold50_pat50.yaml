experiment:
  name: o3_ft_235UALL_lr5e4_hold50_pat50
  description: o与o2的中间道路：full finetune + lr=5e-4 + CosineHoldAtMin(T_max=50)快速settle
    + patience=50/epochs=200
data:
  csv_path: data/235UALL.csv
  header: true
  columns:
  - Z
  - A
  - E
  - Yield
  - Error
  target_col: 3
  features:
  - Z_norm
  - A_norm
  - E_norm
  - delta_np
  use_delta_np: true
  delta_np_mode: discrete
  split:
    mode: held_out
    val_from_first_n: 3096
    val_ratio: 0.2
    seed: 42
  source: csv
target:
  space: raw
  clip_min: 0.0
  scaler_type: standard
  power: 0.25
model:
  hidden_layers:
  - 20
  - 20
  grid: 20
  k: 4
  seed: 42
train:
  epochs: 200
  batch_size: 512
  optimizer:
    type: AdamW
    lr: 0.0005
    weight_decay: 0.0001
  scheduler:
    type: CosineHoldAtMin
    T_0: 400
    T_mult: 1
    eta_min: 1e-6
    step_size: 500
    gamma: 0.5
    patience: 300
    factor: 0.5
    T_max: 50
  early_stopping:
    patience: 50
    min_delta: 5e-6
    monitor: val_loss
  criterion:
    type: MSE
    low_yield_mode: none
    high_yield_boost: 1.0
    low_yield_quantile: 0.3
    huber_delta: 0.1
  gradient_clip: 1.0
  resume: false
  checkpoint_every: 50
  stop_on_best_below: null
postprocess:
  mass_conservation: false
energy_dep:
  enabled: true
  reference_csv: data/235UALL.csv
  E_range:
  - 0
  - 14
  E_step: 1
  batch_size: 256
finetune:
  init_from: n_power_delta_np
  reuse_scalers_from: n_power_delta_np
  freeze: []
eval:
  eval_set: val
  important_range:
  - 3096
  - 4127
