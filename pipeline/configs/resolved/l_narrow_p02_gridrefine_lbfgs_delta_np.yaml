experiment:
  name: l_narrow_p02_gridrefine_lbfgs_delta_np
  description: 窄网络[10,10]+小网格grid=5/k=3 + 激进低产额幂次p=0.2 + 渐进网格细化5->10->20 + Adam->LBFGS
    + CosineHoldAtMin，delta_np（强正则化/低产额优先，batch=2048）
data:
  csv_path: data/GEF.csv
  header: false
  columns:
  - Z_norm
  - A_norm
  - E_norm
  - Yield
  - Error
  target_col: 3
  features:
  - Z_norm
  - A_norm
  - E_norm
  - delta_np
  use_delta_np: true
  delta_np_mode: discrete
  split: full_train
target:
  space: raw
  clip_min: 0.0
  scaler_type: standard
  power: 0.2
model:
  hidden_layers:
  - 10
  - 10
  grid: 5
  k: 3
  seed: 42
train:
  epochs: 2000
  batch_size: 2048
  optimizer:
    type: AdamW
    lr: 0.05
    weight_decay: 1e-4
  scheduler:
    type: CosineHoldAtMin
    T_0: 400
    T_mult: 1
    eta_min: 1e-5
    step_size: 500
    gamma: 0.5
    patience: 300
    factor: 0.5
    T_max: 400
  early_stopping:
    patience: 400
    min_delta: 5e-6
    monitor: train_loss
  criterion:
    type: MSE
    low_yield_mode: none
    high_yield_boost: 1.0
    low_yield_quantile: 0.3
    huber_delta: 0.1
  gradient_clip: 1.0
  resume: false
  checkpoint_every: 50
  stop_on_best_below: null
  grid_schedule:
  - epoch: 200
    grid: 10
  - epoch: 500
    grid: 15
  lbfgs:
    enabled: true
    start_epoch: 850
    steps: 100
    lr: 1.0
    max_iter: 15
    history_size: 100
postprocess:
  mass_conservation: false
energy_dep:
  enabled: true
  reference_csv: data/235UALL.csv
  E_range:
  - 0
  - 14
  E_step: 1
  batch_size: 256
