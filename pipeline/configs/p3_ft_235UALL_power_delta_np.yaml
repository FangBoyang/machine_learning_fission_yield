# 变体 p3_ft：p3_gef_isomer_delta_np 的 235UALL finetune（目标幂次 p=0.35）。
# 超参数与 p_ft 一致（除 init_from/reuse 指向 p3、target.power=0.35）。数据源 GEF 侧为 gef_isomer_merged（warmup 继承）。
inherit: j_power_delta_np.yaml
experiment:
  name: p3_ft_235UALL_power_delta_np
  description: "基于p3_gef_isomer_delta_np(GEF异构合并warmup,[16,16]/grid15/k3,p=0.35)的235UALL finetune：复用scalers+权重，val仅来自前3096行，val_loss早停"
data:
  source: csv
  csv_path: data/235UALL.csv
  header: true
  columns: [Z, A, E, Yield, Error]
  split:
    mode: held_out
    val_from_first_n: 3096
    val_ratio: 0.2
    seed: 42
model:
  hidden_layers: [16, 16]
  grid: 15
  k: 3
target:
  power: 0.35
finetune:
  init_from: p3_gef_isomer_delta_np
  reuse_scalers_from: p3_gef_isomer_delta_np
  freeze: []
eval:
  eval_set: val
  important_range: [3096, 4127]
train:
  optimizer:
    lr: 0.001
  early_stopping:
    monitor: val_loss
    patience: 100
  checkpoint_every: 50
