# 变体 n：基于 j_power_delta_np 的【正确 GEF warmup】
# 继承 j（width=20-20, grid=20, k=4, 目标幂次 p=0.25, delta_np）。
# 与旧 j 的唯一实质区别：delta_np 用修正后的 discrete 表
#   ee->2-|I|, oo->|I|, eo,N>Z->1, oe,N<Z->1, eo,N<Z->1-|I|, oe,N>Z->1-|I|
#   （common.compute_delta_np 已修正，2026-08-20）。
# 数据源 GEF，100% 训练（full_train，无 val），早停判据 train_loss。
inherit: j_power_delta_np.yaml
experiment:
  name: n_power_delta_np
  description: "基于j_power(p=0.25,width20-20,grid20)的GEF warmup：修正后delta_np，source=gef, full_train, monitor=train_loss"
data:
  source: gef
  split: full_train
train:
  scheduler:
    type: CosineHoldAtMin   # 余弦退火：降到 eta_min 后保持最小值，不回升、不重启
    T_max: 400              # 变化周期与 j_power_delta_np 的 T_0=400 一致
    eta_min: 1e-5           # 最小学习率与 j_power_delta_np 一致
  checkpoint_every: 50   # 周期落 latest+resume，便于安全中断后续训（避免之前 kill 留 orphan 的问题）
