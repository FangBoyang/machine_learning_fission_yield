# v_gef seed=1: 复制 p3_gef_isomer_delta_np，仅 model.seed 不同，其余全照抄 p3。
# 用途：多 seed 集成的 GEF warmup（finetune 阶段 seed 会被 warmup 权重覆盖，差异须来自此处）。
inherit: n_power_delta_np.yaml
experiment:
  name: v1_gef_isomer_delta_np
  description: "复制 p3_gef(GEF异构合并,[16,16]/grid15/k3,p=0.35,full_train,monitor=train_loss,epochs2000/patience400)，仅 model.seed=1。"
data:
  source: csv
  header: true
  csv_path: data/GEF_isomer_merged.csv
  split: full_train
model:
  hidden_layers: [16, 16]
  grid: 15
  k: 3
  seed: 1
target:
  power: 0.35
train:
  epochs: 2000
  early_stopping:
    patience: 400
    min_delta: 5e-6
    monitor: train_loss
  checkpoint_every: 50
