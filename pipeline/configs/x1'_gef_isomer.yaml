# x1'_gef_isomer —— x1 的【纯重复采样对照组】。
# 与 x1 的唯一差别：rel_sigma 全为 0，副本标签 = 原件标签，不加任何噪声。
#
# 目的：分离「过采样（= 重加权）」与「高斯噪声」各自的贡献。
#   按 MSE 下零均值噪声不改变最优点这一性质，预期 x1' ≈ x1；
#   若两者差别很大，则说明起作用的不是噪声的统计效应，而是别的机制。
#
# 其余与 x1 逐字一致：
#   分档（按原始产额分位数）：后 50% 不动 / 中 40% 1 副本 / 前 10% 2 副本
#   结果：9333 -> 约 15005 行（1.6x），高产区样本占比由 10% 升到约 19%
#   训练超参全部沿用 w（受控实验只改数据）
inherit: w1_gef_isomer.yaml
experiment:
  name: "x1'_gef_isomer"
  description: "x1对照组：只做按产额分档的重复采样(副本标签=原件标签)，不加噪声；分档/副本数/训练超参与x1逐字一致，seed=1"
data:
  augment:
    enabled: true
    seed: 42                    # 6 个 seed 共用同一份增广数据（本变体仅 seed 1）
    quantile_edges: [0.5, 0.9]
    n_copies: [0, 1, 2]         # 副本数，不含原件 —— 与 x1 相同
    rel_sigma: [0.0, 0.0, 0.0]  # ↓ 与 x1 的唯一差异：不注入噪声
    noise_mode: multiplicative  # σ=0 时该参数不生效，保留仅为与 x1 对齐
